name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: test + vet
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # typst/rust-toolchain.toml pins the channel.
      - name: Install Rust
        run: rustup show
        working-directory: typst

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: typst
          cache-on-failure: true

      - uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: go-tools-${{ runner.os }}-${{ hashFiles('go.mod') }}

      - name: Install golangci-lint and govulncheck
        run: |
          [ -x ~/go/bin/golangci-lint ] && [ -x ~/go/bin/govulncheck ] ||
            go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest golang.org/x/vuln/cmd/govulncheck@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Tests, library build and vet
        run: scripts/check.sh
