name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # the draft release, and the uploads to it

jobs:
  draft-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the version
        run: test "$GITHUB_REF_NAME" = "v$(jq -r .version mygo.json)"
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi

  build:
    needs: draft-release
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # One platform per row: mygo build takes one CC for all the targets of a run,
        # and the Rust library is built for each target's triple.
        include:
          - { name: macOS, os: macos-latest, platform: darwin/universal, triples: "aarch64-apple-darwin x86_64-apple-darwin" }
          - { name: Linux x64, os: ubuntu-latest, platform: linux/amd64, triples: x86_64-unknown-linux-gnu }
          - { name: Linux arm64, os: ubuntu-24.04-arm, platform: linux/arm64, triples: aarch64-unknown-linux-gnu }
          - { name: Windows, os: windows-latest, platform: windows/amd64, triples: x86_64-pc-windows-gnu }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # typst/rust-toolchain.toml pins the channel; scripts/build-typst.sh adds the targets.
      - name: Install Rust
        run: |
          command -v rustup > /dev/null || {
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          }
          rustup toolchain install
        working-directory: typst

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: typst
          key: ${{ matrix.platform }}

      # cgo and the Rust gnu target need MinGW: gcc for the C code of ring and psm and
      # for cgo, dlltool for the windows crates' import libraries.
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        id: msys2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
          path-type: inherit
      - name: Put MinGW on the PATH
        if: runner.os == 'Windows'
        run: |
          echo '${{ steps.msys2.outputs.msys2-location }}\mingw64\bin' >> "$GITHUB_PATH"

      - name: Build the Typst library
        run: scripts/build-typst.sh ${{ matrix.triples }}

      # internal/typst/cgo.go lists these system libraries per OS; compare when a link fails.
      - name: Show the native libraries the Typst library needs
        working-directory: typst
        run: |
          for target in ${{ matrix.triples }}; do
            cargo rustc --release --target "$target" --lib -- --print native-static-libs 2>&1 | grep native-static-libs
          done

      - name: Cache NSIS
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\mygo\nsis-*
          key: nsis-${{ hashFiles('go.sum') }}

      # Signing the macOS app needs these secrets, and in mygo.json macos.signingIdentity
      # and macos.notarize.keychainProfile "notary" (MyGo's docs/github-actions.md).
      # mygo.json cannot read NOTARY_KEYCHAIN, so notarytool has to find the profile
      # in the keychains this step lists.
      - name: Import the certificate and the notary credentials
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain
          xcrun notarytool store-credentials notary --keychain "$keychain" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
          echo "NOTARY_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      # Signing the Windows app needs these secrets, windows.certificate in mygo.json set to
      # the path this step writes (mygo.json cannot read WINDOWS_CERTIFICATE_FILE), and
      # MYGO_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      # in the env of "Build and upload". On a Windows runner mygo build signs with signtool.
      # - name: Write the certificate
      #   if: runner.os == 'Windows'
      #   env:
      #     WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      #   run: |
      #     echo "$WINDOWS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/code-signing.pfx"
      #     echo "WINDOWS_CERTIFICATE_FILE=$RUNNER_TEMP/code-signing.pfx" >> "$GITHUB_ENV"

      - name: Build and upload
        env:
          CGO_ENABLED: "1"
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go tool mygo build -platform "${{ matrix.platform }}" -upload
