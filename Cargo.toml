[package]
name = "thesio"
version = "0.1.0"
edition = "2024"
description = "A local-first workspace for academic research and writing"
license = "MIT"
readme = "README.md"
keywords = ["notes", "citations", "typst", "gpui", "local-first"]
categories = ["text-editors"]

# `thesio_core` is the GPUI-free document engine; plain `cargo test` covers both.
[workspace]
members = ["crates/core"]
default-members = [".", "crates/core"]

# Keep macOS debug unwind data within the linker's compact-unwind limit.
[profile.dev.package.thesio]
opt-level = 1

# Unoptimized rendering libraries take seconds per compile, against milliseconds in release.
[profile.dev.package."*"]
opt-level = 2

[dependencies]
thesio_core = { path = "crates/core" }
anyhow = "1.0.104"
dirs = "7.0.0"
gpui = "0.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9"
image = { version = "0.25", default-features = false, features = ["png"] }
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"
foreign-types = "0.5"
objc = "0.2"

# GPUI 0.2.2 with local changes: glyphs are rasterized without font
# smoothing (Feishu's `-webkit-font-smoothing: antialiased`) and grids take
# explicit pixel column widths. Taffy 0.9.0 with the beyond-limits fix for
# items spanning several auto rows (merged table cells).
[patch.crates-io]
gpui = { path = "vendor/gpui" }
taffy = { path = "vendor/taffy" }

# `objc`'s msg_send! checks `feature = "cargo-clippy"`, which rustc no longer
# knows about.
[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

# Style lints that fight the code's deliberate shape (GPUI closures with
# long types, pixel tables indexed by column, enums of laid-out lines).
[workspace.lints.clippy]
type_complexity = "allow"
too_many_arguments = "allow"
needless_range_loop = "allow"
large_enum_variant = "allow"
field_reassign_with_default = "allow"
wrong_self_convention = "allow"
unusual_byte_groupings = "allow"

[lints]
workspace = true
