# The document engine: model, DocxXML, the editing core, the library on
# disk, import and export. No GPUI, so it builds and tests on its own.
[package]
name = "thesio_core"
version = "0.1.0"
edition = "2024"
description = "The document engine behind Thesio: model, DocxXML, editing core, library"
license = "MIT"
readme = "../../README.md"

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
unicode-segmentation = "1.13.3"
rustc-hash = "2.1"
typst = "0.15.1"
typst-layout = "0.15.1"
typst-pdf = "0.15.1"
typst-render = "0.15.1"
comemo = "0.5.1"
typst-kit = { version = "0.15.1", features = ["embedded-fonts"] }
hayagriva = { version = "0.10.1", default-features = false, features = ["biblatex"] }
serde_yaml = "0.9"
ureq = "3"

[lints]
workspace = true
